<h1> Accounts Dashboard </h1>

<table class="table">
    <thead>
    <tr>
        <th> Account Id</th>
        <th> Account Holder Name</th>
        <th> Account Type</th>
        <th> Account Balance</th>
        <th>Account Options</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let user of acctlist">
        <td> {{user.id}}</td>
        <td> {{user.name}}</td>
        <td> {{user.type}}</td>
        <td> {{user.balance}}</td>
        
        <td> 
            <button type= "submit" (click)="viewdetails(user)" >View Details</button>
            <button type="submit" (click)="deletei(user.id)"> Delete </button>
        </td>

    </tr>
    </tbody>

</table>
<button type="submit" (click)="addAccount()">Add Account</button>
