
<title>User Dashboard</title>
<h1 >User DataBase</h1>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div paddingtop="200px" class="container">

<table class="table mytable" >
  <thead>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Website</th>
      <th>Operations</th>
    </tr>
  </thead>


  <tbody>
    <tr *ngFor="let user of users">

      <td >
          {{user.id}}
      </td>



       <td  *ngIf ="user.id !== editid">
          {{user.name}}
      </td>

      <td *ngIf="user.id === editid">
        <input type="text" placeholder="Enter New Name" [(ngModel)]="editobj.name">
      </td>


       <td *ngIf="user.id!==editid" >
          {{user.website}}
      </td>

      <td *ngIf="user.id===editid">
        <input type="text" placeholder="Enter New Website" [(ngModel)]="editobj.website">
      </td>


      <td *ngIf="user.id!==editid">
        <button type="submit" (click)="onEdit(user.id) "  class="btn btn-primary " paddingright="10px" >Edit This Data            </button>
        <button type="submit" (click)="onDelete(user.id)" class="btn btn-danger">Delete This Data</button>
      </td>

      <td  *ngIf="user.id===editid">
          <button type="submit" (click)="saveEdit()"> Save Edit</button>
          <button type="submit" (click)="cancleEdit()">Cancel Edit</button>
      </td>
    </tr>
  </tbody>
  </table>
  </div>
